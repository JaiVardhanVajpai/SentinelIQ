<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="580" fill="#0a0f1e"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle"
        font-size="15" font-weight="600" fill="#f1f5f9">
    SentinelIQ — 5-Layer Investigation Pipeline
  </text>

  <!-- LAYER LABELS (left side) -->
  <text x="18" y="108" font-size="9" fill="#475569"
        font-weight="500" transform="rotate(-90,18,108)">INPUT</text>
  <text x="18" y="208" font-size="9" fill="#475569"
        font-weight="500" transform="rotate(-90,18,208)">ENRICH</text>
  <text x="18" y="308" font-size="9" fill="#475569"
        font-weight="500" transform="rotate(-90,18,308)">DETECT</text>
  <text x="18" y="408" font-size="9" fill="#475569"
        font-weight="500" transform="rotate(-90,18,408)">AI</text>
  <text x="18" y="510" font-size="9" fill="#475569"
        font-weight="500" transform="rotate(-90,18,510)">DECIDE</text>

  <!-- ── LAYER 1: INPUT ── -->
  <!-- Analyst box -->
  <rect x="50" y="60" width="120" height="52" rx="8"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="110" y="80" text-anchor="middle"
        font-size="11" fill="#94a3b8">Analyst Input</text>
  <text x="110" y="96" text-anchor="middle"
        font-size="9" fill="#475569">IP / URL / Login CSV</text>
  <text x="110" y="108" text-anchor="middle"
        font-size="9" fill="#475569">Raw alert text</text>

  <!-- React frontend box -->
  <rect x="220" y="60" width="120" height="52" rx="8"
        fill="#1e3a5f" stroke="#1d4ed8" stroke-width="1"/>
  <text x="280" y="80" text-anchor="middle"
        font-size="11" fill="#93c5fd">React Frontend</text>
  <text x="280" y="96" text-anchor="middle"
        font-size="9" fill="#60a5fa">Tailwind CSS</text>
  <text x="280" y="108" text-anchor="middle"
        font-size="9" fill="#60a5fa">Dark SOC theme</text>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="86" x2="390" y2="86"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FastAPI box -->
  <rect x="390" y="60" width="130" height="52" rx="8"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="455" y="80" text-anchor="middle"
        font-size="11" fill="#94a3b8">FastAPI Backend</text>
  <text x="455" y="96" text-anchor="middle"
        font-size="9" fill="#475569">Python 3.11</text>
  <text x="455" y="108" text-anchor="middle"
        font-size="9" fill="#475569">Auto OpenAPI docs</text>

  <!-- Arrow input→enrich -->
  <line x1="455" y1="112" x2="455" y2="148"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 2: ENRICHMENT ── -->
  <rect x="270" y="148" width="130" height="52" rx="8"
        fill="#1a3a1a" stroke="#16a34a" stroke-width="1"/>
  <text x="335" y="168" text-anchor="middle"
        font-size="11" fill="#86efac">VirusTotal</text>
  <text x="335" y="184" text-anchor="middle"
        font-size="9" fill="#4ade80">70-engine URL scan</text>
  <text x="335" y="196" text-anchor="middle"
        font-size="9" fill="#4ade80">Phishing verdict</text>

  <rect x="420" y="148" width="130" height="52" rx="8"
        fill="#1a3a1a" stroke="#16a34a" stroke-width="1"/>
  <text x="485" y="168" text-anchor="middle"
        font-size="11" fill="#86efac">AbuseIPDB</text>
  <text x="485" y="184" text-anchor="middle"
        font-size="9" fill="#4ade80">IP reputation score</text>
  <text x="485" y="196" text-anchor="middle"
        font-size="9" fill="#4ade80">Tor / VPN detection</text>

  <rect x="570" y="148" width="130" height="52" rx="8"
        fill="#1a3a1a" stroke="#16a34a" stroke-width="1"/>
  <text x="635" y="168" text-anchor="middle"
        font-size="11" fill="#86efac">Risk Scoring</text>
  <text x="635" y="184" text-anchor="middle"
        font-size="9" fill="#4ade80">Weighted composite</text>
  <text x="635" y="196" text-anchor="middle"
        font-size="9" fill="#4ade80">Score 0–100</text>

  <!-- Arrows enrich→detect -->
  <line x1="335" y1="200" x2="335" y2="248"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="485" y1="200" x2="485" y2="248"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="635" y1="200" x2="635" y2="248"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 3: DETECTION ── -->
  <rect x="200" y="248" width="130" height="52" rx="8"
        fill="#2d1a00" stroke="#d97706" stroke-width="1"/>
  <text x="265" y="268" text-anchor="middle"
        font-size="11" fill="#fcd34d">Brute Force</text>
  <text x="265" y="284" text-anchor="middle"
        font-size="9" fill="#fbbf24">5+ failures / 10 min</text>
  <text x="265" y="296" text-anchor="middle"
        font-size="9" fill="#fbbf24">Same IP rule</text>

  <rect x="350" y="248" width="130" height="52" rx="8"
        fill="#2d1a00" stroke="#d97706" stroke-width="1"/>
  <text x="415" y="268" text-anchor="middle"
        font-size="11" fill="#fcd34d">Impossible Travel</text>
  <text x="415" y="284" text-anchor="middle"
        font-size="9" fill="#fbbf24">Geo + timestamp</text>
  <text x="415" y="296" text-anchor="middle"
        font-size="9" fill="#fbbf24">Physics check</text>

  <rect x="500" y="248" width="130" height="52" rx="8"
        fill="#2d1a00" stroke="#d97706" stroke-width="1"/>
  <text x="565" y="268" text-anchor="middle"
        font-size="11" fill="#fcd34d">Cred Stuffing</text>
  <text x="565" y="284" text-anchor="middle"
        font-size="9" fill="#fbbf24">Many users / one IP</text>
  <text x="565" y="296" text-anchor="middle"
        font-size="9" fill="#fbbf24">Pattern match</text>

  <rect x="650" y="248" width="130" height="52" rx="8"
        fill="#2d1a00" stroke="#d97706" stroke-width="1"/>
  <text x="715" y="268" text-anchor="middle"
        font-size="11" fill="#fcd34d">MITRE Mapping</text>
  <text x="715" y="284" text-anchor="middle"
        font-size="9" fill="#fbbf24">ChromaDB vectors</text>
  <text x="715" y="296" text-anchor="middle"
        font-size="9" fill="#fbbf24">Semantic search</text>

  <!-- Arrows detect→AI -->
  <line x1="415" y1="300" x2="415" y2="348"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="715" y1="300" x2="715" y2="348"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 4: AI ── -->
  <rect x="270" y="348" width="180" height="52" rx="8"
        fill="#2d1635" stroke="#7c3aed" stroke-width="1"/>
  <text x="360" y="368" text-anchor="middle"
        font-size="11" fill="#d8b4fe">RAG Pipeline</text>
  <text x="360" y="384" text-anchor="middle"
        font-size="9" fill="#c084fc">ChromaDB retrieval</text>
  <text x="360" y="396" text-anchor="middle"
        font-size="9" fill="#c084fc">Groq LLaMA 3.1 8B</text>

  <rect x="470" y="348" width="180" height="52" rx="8"
        fill="#2d1635" stroke="#7c3aed" stroke-width="1"/>
  <text x="560" y="368" text-anchor="middle"
        font-size="11" fill="#d8b4fe">Explainability</text>
  <text x="560" y="384" text-anchor="middle"
        font-size="9" fill="#c084fc">Signal breakdown</text>
  <text x="560" y="396" text-anchor="middle"
        font-size="9" fill="#c084fc">Per-source scores</text>

  <!-- Arrows AI→decision -->
  <line x1="360" y1="400" x2="360" y2="448"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="400" x2="560" y2="448"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── LAYER 5: DECISION ── -->
  <rect x="80" y="448" width="120" height="52" rx="8"
        fill="#1a0505" stroke="#dc2626" stroke-width="1"/>
  <text x="140" y="468" text-anchor="middle"
        font-size="11" fill="#fca5a5">Approve</text>
  <text x="140" y="484" text-anchor="middle"
        font-size="9" fill="#f87171">True positive</text>
  <text x="140" y="496" text-anchor="middle"
        font-size="9" fill="#f87171">Create incident</text>

  <rect x="220" y="448" width="120" height="52" rx="8"
        fill="#052e16" stroke="#16a34a" stroke-width="1"/>
  <text x="280" y="468" text-anchor="middle"
        font-size="11" fill="#86efac">Reject</text>
  <text x="280" y="484" text-anchor="middle"
        font-size="9" fill="#4ade80">False positive</text>
  <text x="280" y="496" text-anchor="middle"
        font-size="9" fill="#4ade80">Log &amp; close</text>

  <rect x="360" y="448" width="120" height="52" rx="8"
        fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="420" y="468" text-anchor="middle"
        font-size="11" fill="#fcd34d">Escalate</text>
  <text x="420" y="484" text-anchor="middle"
        font-size="9" fill="#fbbf24">Tier 2 review</text>
  <text x="420" y="496" text-anchor="middle"
        font-size="9" fill="#fbbf24">Complex cases</text>

  <rect x="500" y="448" width="120" height="52" rx="8"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="560" y="468" text-anchor="middle"
        font-size="11" fill="#94a3b8">PDF Report</text>
  <text x="560" y="484" text-anchor="middle"
        font-size="9" fill="#475569">One-click export</text>
  <text x="560" y="496" text-anchor="middle"
        font-size="9" fill="#475569">Audit trail</text>

  <rect x="640" y="448" width="120" height="52" rx="8"
        fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="700" y="468" text-anchor="middle"
        font-size="11" fill="#94a3b8">MongoDB</text>
  <text x="700" y="484" text-anchor="middle"
        font-size="9" fill="#475569">All decisions saved</text>
  <text x="700" y="496" text-anchor="middle"
        font-size="9" fill="#475569">Threat hunting</text>

  <!-- Connector lines input→enrich -->
  <line x1="170" y1="86" x2="220" y2="86"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Horizontal lines in enrich layer from FastAPI down -->
  <line x1="455" y1="148" x2="335" y2="148" stroke="#334155" stroke-width="1"/>
  <line x1="455" y1="148" x2="635" y2="148" stroke="#334155" stroke-width="1"/>

  <!-- Horizontal line in detect layer -->
  <line x1="265" y1="348" x2="415" y2="348" stroke="#334155" stroke-width="1"/>
  <line x1="715" y1="348" x2="560" y2="348" stroke="#334155" stroke-width="1"/>
  <line x1="265" y1="300" x2="265" y2="348"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="565" y1="300" x2="565" y2="348"
        stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="450" y="560" text-anchor="middle"
        font-size="9" fill="#1e293b">
    SentinelIQ v4.0 — Render (Backend) + Vercel (Frontend) + MongoDB Atlas
  </text>
</svg>
